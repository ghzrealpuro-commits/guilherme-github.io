<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMEC Smart Tools — Sistema</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f3;--surface:#fff;--ink:#1c2830;--muted:#5a6a75;--line:#cfd7dc;--steel:#24323c;--accent:#f2b01e;--ok:#12806a;--use:#c9561a;--res:#a8740a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--surface:#1b262e;--ink:#e8eef1;--muted:#98a8b2;--line:#2f3d47;--steel:#0b1116;--ok:#3fc6a8;--use:#ff8a4d;--res:#f2b01e}}
:root[data-theme="dark"]{--bg:#121a20;--surface:#1b262e;--ink:#e8eef1;--muted:#98a8b2;--line:#2f3d47;--steel:#0b1116;--ok:#3fc6a8;--use:#ff8a4d;--res:#f2b01e}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.1;margin:0 0 .5em}
h2{font-size:2rem}h3{font-size:1.3rem}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{background:var(--steel);color:#f2f5f7;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font:700 1.5rem "Barlow Condensed",sans-serif}
.top span{font-size:.9rem;color:#c3cfd6}
.tabs{background:var(--steel);display:flex;overflow-x:auto;padding:0 10px;position:sticky;top:0;z-index:4}
.tabs button{background:none;border:0;color:#9fb0ba;padding:12px 14px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.btn{background:var(--accent);color:#1c2830;border:0;padding:10px 18px;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.top .btn.sec{color:#fff;border-color:#9fb0ba}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);padding:14px;border-left:5px solid var(--line)}
.stat strong{display:block;font:700 2.6rem/1 "Barlow Condensed",sans-serif}
.stat.d{border-color:var(--ok)}.stat.r{border-color:var(--res)}.stat.u{border-color:var(--use)}
.box{background:var(--surface);padding:16px;margin-bottom:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:.95rem}
th{font:600 1.05rem "Barlow Condensed",sans-serif}
.st{font-weight:600;font-size:.88rem}
.st.d{color:var(--ok)}.st.u{color:var(--use)}.st.r{color:var(--res)}
.muted,.note{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,select{padding:9px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:180px}
.welcome{background:var(--surface);border-left:6px solid var(--ok);padding:14px 18px;margin-bottom:18px}
.welcome h3{font-size:1.8rem;margin:0 0 4px}
.flash{padding:10px 14px;margin-bottom:14px;border-left:6px solid var(--accent);background:var(--surface);font-weight:500}
.flash.err{border-color:var(--use)}
.login{max-width:380px;margin:8vh auto;padding:0 18px}
.login h1{font-size:3rem}
.login form{display:grid;gap:12px;margin:18px 0 12px}
.login input,.login select{width:100%}
.pad{display:block;margin:22px auto 8px;width:200px;height:200px;border-radius:50%;border:4px solid var(--ink);background:var(--surface);color:var(--ink);position:relative;overflow:hidden;padding:12px}
.pad svg{width:100%;height:100%}
.pad .beam{position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent);opacity:0}
.pad.scanning{border-color:var(--accent)}
.pad.scanning .beam{opacity:1;animation:sweep 1.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 4px)}}
.pad.ok{border-color:var(--ok);color:var(--ok)}
@media (prefers-reduced-motion:reduce){.pad.scanning .beam{animation:none;top:50%}}
/* Como funciona em 3D */
main:has(#stage){max-width:1280px}
#stage{position:relative;height:min(66vh,600px);overflow:hidden;background:radial-gradient(circle at 50% 30%,var(--surface),var(--bg));margin-bottom:16px}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:3px solid var(--accent);padding:2px 8px;font-weight:600;font-size:.78rem;pointer-events:none;white-space:nowrap}
.hint{position:absolute;right:10px;top:10px;font-size:.8rem;color:var(--muted);background:var(--surface);padding:3px 8px;border:1px solid var(--line)}
#reset{position:absolute;right:10px;bottom:10px;background:var(--surface);color:var(--ink);border:1px solid var(--ink);padding:6px 12px;font:600 .85rem Barlow,sans-serif}
#err{padding:30px;text-align:center}
.cfpanel h3{font-size:1.7rem;margin:0 0 4px}
.cfpanel p{margin:0 0 10px;min-height:3em}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl button{border:0;padding:10px 16px;font:600 1rem Barlow,sans-serif;background:var(--steel);color:#fff;min-height:44px}
.ctl .go{background:var(--accent);color:#1c2830}
.dots{display:flex;gap:6px;margin-left:auto}
.dots button{width:34px;min-height:34px;padding:0;background:transparent;color:var(--ink);border:2px solid var(--line)}
.dots button[aria-current="step"]{background:var(--accent);color:#1c2830;border-color:var(--accent)}
/* ===== Camada tech ===== */
body{background-image:radial-gradient(circle at 15% 8%,rgba(0,229,255,.07),transparent 42%),radial-gradient(circle at 88% 92%,rgba(242,176,30,.08),transparent 45%)}
.top{background:linear-gradient(90deg,#0b1116,#24323c 50%,#0b1116);box-shadow:0 2px 20px rgba(0,229,255,.28)}
.tabs button{transition:color .2s,border-color .2s,text-shadow .2s}
.tabs button[aria-current="page"]{text-shadow:0 0 14px rgba(242,176,30,.85)}
.box,.stat{box-shadow:0 0 0 1px rgba(0,229,255,.1),0 8px 26px rgba(0,0,0,.22)}
.box{position:relative;overflow:hidden}
.box::before{content:"";position:absolute;top:0;left:0;width:24px;height:24px;border-top:2px solid #00e5ff;border-left:2px solid #00e5ff;opacity:.65;pointer-events:none}
.box::after{content:"";position:absolute;bottom:0;right:0;width:24px;height:24px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);opacity:.65;pointer-events:none}
.btn{box-shadow:0 0 14px rgba(242,176,30,.3);transition:box-shadow .2s}
.btn:hover{box-shadow:0 0 22px rgba(242,176,30,.55)}
.btn.sec:hover{border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 14px rgba(0,229,255,.45)}
.stat strong{text-shadow:0 0 18px rgba(0,229,255,.5)}
.lk3d{background:none;border:0;color:var(--ink);font:600 1rem "Barlow Condensed",sans-serif;cursor:pointer;padding:0;text-decoration:underline dotted}
.lk3d:hover{color:#00e5ff;text-shadow:0 0 10px rgba(0,229,255,.7)}
.t3d-ov{position:fixed;inset:0;background:rgba(4,10,14,.75);backdrop-filter:blur(5px);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.t3d{width:min(880px,96vw);height:min(620px,90vh);background:linear-gradient(165deg,#0d151c,#18242e);border:1px solid rgba(0,229,255,.4);box-shadow:0 0 46px rgba(0,229,255,.28),inset 0 0 70px rgba(0,0,0,.55);color:#e8eef1;display:flex;flex-direction:column;overflow:hidden}
.t3d-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(0,229,255,.25);background:rgba(0,229,255,.05)}
.t3d-hd b{font:700 1.35rem "Barlow Condensed",sans-serif}
.t3d-x{background:none;border:1px solid #9fb0ba;color:#e8eef1;width:34px;height:34px;font-size:1rem;cursor:pointer}
.t3d-x:hover{border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 10px rgba(0,229,255,.5)}
.t3d-st{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 35%,#182631,#0a1218 75%)}
.t3d-st canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.t3d-st canvas:active{cursor:grabbing}
.t3d-hint{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:#9fb0ba;background:rgba(13,21,28,.8);border:1px solid rgba(0,229,255,.25);padding:3px 8px}
.t3d-tag{position:absolute;right:12px;top:10px;font:600 .72rem "Barlow Condensed",sans-serif;letter-spacing:.14em;color:#00e5ff;border:1px solid rgba(0,229,255,.4);padding:2px 8px;background:rgba(0,229,255,.06)}
/* Como funciona — layout moderno */
.cfhero{font-size:2.6rem;margin-bottom:2px}
.cfsub{color:var(--muted);font-size:1.08rem;margin:0 0 14px;max-width:780px}
.cfpanel{border-top:5px solid var(--accent);padding:20px 22px}
.cfpanel h3{font-size:2rem;margin:0 0 6px}
.cfpanel p{font-size:1.05rem;min-height:3.2em}
.cfttl{font-size:1.6rem;margin:26px 0 4px}
.cflead{color:var(--muted);font-size:.98rem;margin:0 0 14px}
.cfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:26px}
.cfcard{position:relative;background:var(--surface);border:1px solid var(--line);padding:14px 16px 15px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:7px;animation:cfIn .55s both;transition:transform .18s,box-shadow .18s,border-color .18s}
.cfcard:hover{transform:translateY(-3px);border-color:#00e5ff;box-shadow:0 8px 22px rgba(0,229,255,.16)}
.cfcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 26px rgba(242,176,30,.2)}
.cfcard.on::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.cfch{display:flex;align-items:center;gap:10px}
.cfn{width:30px;height:30px;flex:none;border-radius:50%;background:var(--steel);color:#fff;font:700 1rem "Barlow Condensed",sans-serif;display:flex;align-items:center;justify-content:center;transition:background .2s,box-shadow .2s}
.cfcard.on .cfn{background:var(--accent);color:#1c2830;box-shadow:0 0 12px rgba(242,176,30,.75)}
.cfic{width:26px;height:26px;flex:none;margin-left:auto;color:#00e5ff}
.cfic svg{width:100%;height:100%;display:block}
.cfcard b{font:600 1.2rem "Barlow Condensed",sans-serif;line-height:1.1}
.cfcard p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.45}
@keyframes cfIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cfcard{animation:none}}
@media (max-width:600px){.cfhero{font-size:2.1rem}.cfpanel h3{font-size:1.6rem}.cfgrid{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
var KEY="emec-smart-sistema-v2",LB={d:"Disponível",u:"Em uso"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(t){return new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function hhmm(){return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function seed(){
 var now=Date.now(),L=[["Alargador","Corte"],["Bedame","Corte"],["Broca","Corte"],["Broca de centro","Corte"],["Escareador","Corte"],["Fresa","Corte"],["Fresa de topo","Corte"],["Macho de rosca","Corte"],["Pastilha","Corte"],["Tarraxa","Corte"],["Bloco-padrão","Medição"],["Calibrador de rosca","Medição"],["Goniômetro","Medição"],["Micrômetro","Medição"],["Paquímetro","Medição"],["Relógio comparador","Medição"],["Chave de impacto","Aperto"],["Chave de torque","Aperto"],["Soquete","Aperto"],["Torquímetro","Aperto"],["Esmerilhadeira","Elétrica"],["Furadeira portátil","Elétrica"],["Parafusadeira","Elétrica"],["Rebolo","Elétrica"]];
 var tools=L.map(function(x,i){return {id:x[0].replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()+("00"+(i+1)).slice(-3),n:x[0],c:x[1],s:"d",op:null,os:null,t:now}});
 var ops=[{m:"1001",n:"Carlos Eduardo Ferreira Lima",p:"admin",g:"03"},{m:"1002",n:"Mariana Souza Oliveira",p:"operador",g:"07"},{m:"1003",n:"João Pedro Almeida Costa",p:"operador",g:"12"},{m:"1004",n:"Ana Beatriz Rodrigues Martins",p:"operador",g:"15"}];
 var os=[{n:"OS-1042",d:"Usinagem de eixo, lote 12"},{n:"OS-1043",d:"Manutenção da prensa 3"},{n:"OS-1044",d:"Calibração de gabaritos"}];
 var hist=[];
 [["Broca","u","1002","OS-1042"],["Paquímetro","u","1003","OS-1042"],["Chave de torque","u","1004","OS-1043"]].forEach(function(x,i){
  var t=tools.filter(function(y){return y.n===x[0]})[0];t.s=x[1];t.op=x[2];t.os=x[3];t.t=now-(4-i)*600000;
  hist.push({t:t.t,k:x[1]==="u"?"Retirada":"Reserva",id:t.id,n:t.n,op:x[2],os:x[3]});
 });
 return {tools:tools,ops:ops,os:os,hist:hist};
}
function load(){try{var j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load(),U=null,scanning=false,ident=null,selOp=S.ops[0].m,tab="painel",flash=null,welcome=null,q="",fe="",cod="",osSel="",foc=null;
function opn(m){var o=S.ops.filter(function(x){return x.m===m})[0];return o?o.n:"—"}
function chip(s,t){var lk=t&&t.s==="u"&&t.op&&U&&t.op!==U.m;return '<span class="st '+s+'">'+(lk?"🔒 ":"")+LB[s]+'</span>'}
function admin(){return U&&U.p==="admin"}
function entrar(o){
 U=o;tab="painel";
 var h=new Date().getHours(),sd=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
 welcome={h:hhmm(),t:sd+", "+o.n+"!",g:o.g};
 S.hist.push({t:Date.now(),k:"Chegada",id:"—",n:"Acesso ao sistema",op:o.m,os:"—"});save();
}
function loginView(){
 var h='<div class="login"><h1>EMEC Smart Tools</h1><p class="muted">Sistema de controle de ferramentas</p>';
 h+='<button class="pad'+(ident?' ok':scanning?' scanning':'')+'" data-act="scan" aria-label="Colocar o dedo no leitor de digital"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M40 62a10 10 0 0 1 20 0v10"/><path d="M32 66a18 18 0 0 1 36 0v12"/><path d="M24 70a26 26 0 0 1 52 0v8"/><path d="M16 74a34 34 0 0 1 68 0v4"/><path d="M50 56v26"/></svg><span class="beam"></span></button>';
 h+='<p class="note" role="status" style="text-align:center">'+(ident?'':scanning?'Lendo digital…':'Toque no leitor para colocar o dedo.')+'</p>';
 if(ident){var hr=new Date().getHours(),sd=hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite";h+='<div class="welcome" role="status"><p class="muted" style="margin:0">Digital reconhecida. Chegada registrada às '+hhmm()+'</p><h3>'+esc(sd+", "+ident.n+"!")+'</h3><p style="margin:0">Usuário '+esc(ident.m)+'. Abrindo o sistema…</p></div>'}
 h+='<label>Simular a digital de<select id="mat">'+S.ops.map(function(o){return '<option value="'+esc(o.m)+'"'+(o.m===selOp?' selected':'')+'>'+esc(o.n)+'</option>'}).join("")+'</select></label><p class="note" style="margin-top:12px">Demonstração: operadores e digitais fictícios. No uso real, o leitor biométrico fica ligado ao computador ou tablet.</p></div>';
 return h;
}
function shell(v){
 var T=[["painel","Painel"],["mov","Movimentar"],["tools","Ferramentas"],["os","Ordens de serviço"],["hist","Histórico"],["cf","Como funciona"]];
 return '<header class="top"><div><b>EMEC Smart Tools</b><br><span>'+esc(U.n)+' ('+esc(U.p)+')</span></div><button class="btn sec sm" data-act="sair">Sair</button></header><nav class="tabs" aria-label="Módulos">'+T.map(function(x){return '<button data-act="tab" data-v="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'>'+x[1]+'</button>'}).join("")+'</nav><main>'+(flash?'<div class="flash'+(flash.err?' err':'')+'" role="status">'+esc(flash.m)+'</div>':'')+v+'</main>';
}
function cnt(s){return S.tools.filter(function(t){return t.s===s}).length}
function painel(){
 var uso=S.tools.filter(function(t){return t.s!=="d"}).sort(function(a,b){return a.n.localeCompare(b.n,"pt")});
 return (welcome?'<div class="welcome"><p class="muted" style="margin:0">Chegada registrada às '+esc(welcome.h)+'</p><h3>'+esc(welcome.t)+'</h3><p style="margin:0">Sua gaveta nº '+esc(welcome.g)+' está liberada. Boa jornada de trabalho!</p></div>':'')+
 '<h2>Painel</h2><div class="grid"><div class="stat d"><strong>'+cnt("d")+'</strong>Disponíveis</div><div class="stat u"><strong>'+cnt("u")+'</strong>Em uso</div><div class="stat"><strong>'+S.tools.length+'</strong>Total</div></div>'+
 '<div class="cols"><div class="box"><h3>Em uso agora</h3><div class="sc"><table><thead><tr><th>Ferramenta</th><th>Situação</th><th>Operador</th><th>OS</th></tr></thead><tbody>'+(uso.map(function(t){return '<tr><td>'+esc(t.n)+' <span class="muted">'+esc(t.id)+'</span></td><td>'+chip(t.s,t)+'</td><td>'+esc(opn(t.op))+'</td><td>'+esc(t.os)+'</td></tr>'}).join("")||'<tr><td colspan="4">Nenhuma ferramenta em uso.</td></tr>')+'</tbody></table></div></div>'+
 '<div class="box"><h3>Últimas movimentações</h3><div class="sc"><table><thead><tr><th>Quando</th><th>Evento</th><th>Operador</th></tr></thead><tbody>'+S.hist.slice(-8).reverse().map(function(h){return '<tr><td>'+fmt(h.t)+'</td><td>'+esc(h.k+" — "+h.n)+'</td><td>'+esc(opn(h.op))+'</td></tr>'}).join("")+'</tbody></table></div></div></div>'+(admin()?'<button class="btn sec" data-act="reset">Restaurar dados de demonstração</button>':'');
}
function acoes(t){
 if(t.s==="d")return [["u","Retirar"]];
 if(t.s==="u"&&t.op===U.m)return [["d","Devolver"]];
 return [];
}
function mov(){
 var t=S.tools.filter(function(x){return x.id===cod})[0],open=S.os;
 var h='<h2>Movimentar</h2><div class="box"><form id="f-cod" class="bar"><label>Código da ferramenta (QR Code ou digitação)<input id="cod" value="'+esc(cod)+'" placeholder="Ex.: BR003" autocomplete="off"></label><button class="btn">Buscar</button></form>';
 if(cod&&!t)h+='<p class="flash err">Código não encontrado.</p>';
 if(t){
  var A=acoes(t);
  h+='<h3>'+esc(t.n)+' <span class="muted">'+esc(t.id)+'</span> '+chip(t.s,t)+' <button class="btn sec sm" data-act="t3d" data-id="'+esc(t.id)+'">Ver em 3D</button></h3>';
  if(t.s!=="d")h+='<p>Com <b>'+esc(opn(t.op))+'</b>, ordem de serviço '+esc(t.os)+', desde '+fmt(t.t)+'.</p>';
  if(!A.length)h+='<p class="flash err">🔒 Bloqueado: esta ferramenta está em uso por <b>'+esc(opn(t.op))+'</b>. Somente quem a retirou com a própria digital pode devolvê-la.</p>';
  else h+='<div class="bar"><label>Ordem de serviço<select id="os">'+open.map(function(o){return '<option'+((osSel||t.os)===o.n?' selected':'')+' value="'+esc(o.n)+'">'+esc(o.n+" — "+o.d)+'</option>'}).join("")+'</select></label>'+A.map(function(a){return '<button class="btn" data-act="mv" data-a="'+a[0]+'">'+a[1]+'</button>'}).join("")+'</div>';
 }
 h+='</div><div class="box"><h3>Minhas ferramentas</h3>';
